name: Pytest

on:
  workflow_call:
    secrets:
      VELOX_TOKEN:
        required: false

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      env:
          VELOX_TOKEN: ${{ secrets.VELOX_TOKEN }}
      run: |
        pytest --junitxml=report.xml

    - name: Measure coverage
      run: |
        pytest -m 'not integration' --cov=veloxq_sdk --cov-report=xml --cov-report=json:coverage.json --cov-fail-under=90
