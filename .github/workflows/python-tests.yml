name: Pytest

on:
  workflow_call:
    secrets:
      VELOX_TOKEN:
        required: false

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      env:
          VELOX_TOKEN: ${{ secrets.VELOX_TOKEN }}
      run: |
        pytest --junitxml=report.xml

    - name: Measure coverage
      run: |
        pytest -m 'not integration' --cov=veloxq_sdk --cov-report=xml --cov-report=json:coverage.json

    - name: Verify coverage does not decrease
      if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REPORT: ${{ runner.temp }}/coverage-base.json
      run: |
        base_dir="$RUNNER_TEMP/veloxq-sdk-base"
        trap 'git worktree remove --force "$base_dir"' EXIT
        git worktree add --detach "$base_dir" "$BASE_SHA"
        (
          cd "$base_dir"
          pytest -m 'not integration' --cov=veloxq_sdk --cov-report="json:$BASE_REPORT" -q
        )
        python - <<'PY'
        import json
        import os
        import pathlib

        current = json.loads(pathlib.Path('coverage.json').read_text())
        base = json.loads(pathlib.Path(os.environ['BASE_REPORT']).read_text())
        current_percent = current['totals']['percent_covered']
        base_percent = base['totals']['percent_covered']
        print(f'Base coverage: {base_percent:.2f}%')
        print(f'PR coverage:   {current_percent:.2f}%')
        if current_percent < base_percent:
            raise SystemExit('Coverage decreased compared with the PR base')
        PY
